name: Require on-duty PolCam pilot

on:
  push:
    branches:
      - feat/mdt-polcam-remote-feed
    paths:
      - .github/workflows/require-polcam-pilot.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply strict pilot duty guard
        run: python3 scripts/require_polcam_pilot.py

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          LUA_COMPILER="$(command -v luac5.4 || command -v luac)"
          "${LUA_COMPILER}" -p \
            server/cameras.lua \
            server/framework/standalone/provider.lua \
            server/integrations/polcam.lua

      - name: Run contract tests
        run: node --test tests/*.test.js

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit the validated patch
        run: |
          set -euo pipefail
          rm -f scripts/require_polcam_pilot.py
          rm -f .github/workflows/require-polcam-pilot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require an on-duty PolCam pilot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
